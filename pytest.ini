[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
# Coverage is not optional: the floor lives in .coveragerc and a change that adds
# an untested branch fails here instead of being noticed later (QA-19).
addopts = --cov=app --cov-report=term-missing:skip-covered
markers =
    requires_catalog: needs a populated manga catalog; skipped on an empty test database
    requires_artifacts: needs untracked local artifacts (scratch/, scripts/); skipped when absent
filterwarnings =
    # Warnings are not ignored wholesale: each third-party one we cannot fix is
    # pinned to its library and message, and anything raised from app.* fails the
    # run (QA-20). New noise surfaces instead of being hidden.
    ignore:No path_separator found in configuration:DeprecationWarning:alembic.*
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.*
    ignore:unknown class\(es\):UserWarning:sklearn.*
    ignore:Label not .* is present in all training examples:UserWarning:sklearn.*
    ignore:Trying to unpickle estimator:sklearn.exceptions.InconsistentVersionWarning
    error::DeprecationWarning:app.*
    error::UserWarning:app.*
    error::RuntimeWarning:app.*
