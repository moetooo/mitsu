services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mangamind
    ports:
      - "5433:5432"
    shm_size: '1gb'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"


volumes:
  postgres_data:
    external: true
    name: recommend_tool_postgres_data
