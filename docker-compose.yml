name: mitsu

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mitsu
    ports:
      - "5433:5432"
    shm_size: '1gb'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"


volumes:
  postgres_data:
    # Kept external on purpose: the catalogue is the only copy of the data, and
    # `docker compose down -v` must not be able to delete it.
    external: true
    name: mitsu_postgres_data
