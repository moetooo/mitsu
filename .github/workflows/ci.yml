name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mangamind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d mangamind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/mangamind
      REDIS_URL: redis://localhost:6379/0
      SYNC_ADMIN_TOKEN: ci-admin-token
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # tests/conftest.py creates and owns a separate `mangamind_test` database,
      # so the suite never touches the application database. Catalog-dependent
      # tests skip on the empty test database by design.
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend (lint + builds)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Errors fail the build. The 19 remaining react-hooks warnings are
        # tracked findings (FE-03/FE-05/FE-12); tighten to --max-warnings 0 once
        # they are fixed.
        run: npm run lint

      - name: Build app
        run: npm run build

      - name: Build dashboard
        run: npm run build:dashboard
